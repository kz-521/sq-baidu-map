<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    
    <!-- DNS 预解析 -->
    <link rel="dns-prefetch" href="https://api.map.baidu.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <!-- 预连接 -->
    <link rel="preconnect" href="https://api.map.baidu.com" crossorigin>
    
    <!-- 百度地图脚本预加载 -->
    <link rel="preload" as="script" href="https://api.map.baidu.com/api?v=3.0&ak=JZ7exm3yUlWSewreBHs0celsfohscaod&s=1">
    
    <!-- 生产环境 CDN 资源 -->
    <% if (htmlWebpackPlugin.options.cdn) { %>
      <% for (var i in htmlWebpackPlugin.options.cdn.css) { %>
        <link rel="stylesheet" href="<%= htmlWebpackPlugin.options.cdn.css[i] %>">
      <% } %>
    <% } %>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    
    <!-- 百度地图脚本 -->
    <script src="https://api.map.baidu.com/api?v=3.0&ak=JZ7exm3yUlWSewreBHs0celsfohscaod&s=1"></script>
    
    <!-- 生产环境 CDN JS -->
    <% if (htmlWebpackPlugin.options.cdn) { %>
      <% for (var i in htmlWebpackPlugin.options.cdn.js) { %>
        <script src="<%= htmlWebpackPlugin.options.cdn.js[i] %>"></script>
      <% } %>
    <% } %>
    
    <!-- built files will be auto injected -->
  </body>
</html>
